  location: LocationInput
  phoneNumber: String
  professionalAccreditation: [ProfessionalAccreditationInput!]
  professionalTitle: String
  profilePicUrl: String

  """
  Authentication providers used for sign-up (e.g., ["password"], ["google.com"])
  """
  providers: [String!]
  speciality: Speciality
  websiteUrl: String
}

enum UploadPurpose {
  ACCREDITATION_DOCUMENT
  AVATAR
  COVER_PICTURE
  GROUP_PICTURE
  POST_MEDIA
}

type UploadUrlResponse {
  """Object key (path) the file was stored under in the bucket."""
  key: String!

  """Public URL the file will be reachable at once uploaded."""
  publicUrl: String!

  """
  Presigned URL to PUT the file directly to Cloudflare R2. Expires shortly after issuance.
  """
  uploadUrl: String!
}

"""Represents a user, can be an individual or a legal entity."""
interface User {
  accountStatus: AccountStatus!
  authUserId: ID
  bio: String
  blockedUsers: [ID!]

  """List of connected user IDs"""
  connections: [ID!]!
  coverPicUrl: String
  createdAt: DateTime!
  email: String
  fcmTokens: [String!]

  """List of follower user IDs"""
  followers: [ID!]!

  """List of user IDs this user is following"""
  following: [ID!]!

  """Unique identifier for the user (MongoDB ObjectId)"""
  id: ID!
  language: String!
  lastLoginAt: DateTime

  """User location details"""
  location: LocationObject
  phoneNumber: String

  """Professional accreditation documents or details."""
  professionalAccreditation: [ProfessionalAccreditationObject!]
  profilePicUrl: String

  """Authentication providers used by the user (e.g., password, google.com)"""
  providers: [String!]!

  """The unique, URL-friendly identifier for the user."""
  slug: String!
  updatedAt: DateTime!
  userType: UserType!
  websiteUrl: String
}

"""The type of user account: individual or legal entity."""
enum UserType {
  INDIVIDUAL
  LEGAL_ENTITY
}

input VerifyAdminTokenInput {
  token: String!
}
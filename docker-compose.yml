version: "3.9"

services:
  api:
    build: .
    container_name: nest-api
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: nest-postgres
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pmsconnectdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

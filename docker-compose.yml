version: "3.9"

services:
  api:
    build: .
    container_name: nest-api
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    # environment:
      # - REDIS_HOST=redis
      # Override Mongo URI to use local container if preferred, or keep Atlas from .env
      # - MONGODB_URI=mongodb://mongo:27017/pmsconnectdb
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: nest-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
